name: Update Codolio Snapshot

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest Codolio stats
        env:
          CODOLIO_TOKEN: ${{ secrets.CODOLIO_TOKEN }}
          CODOLIO_USERNAME: ${{ secrets.CODOLIO_USERNAME }}
        run: node scripts/update-codolio-snapshot.mjs

      - name: Commit snapshot if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git diff --quiet src/data/codolio-snapshot.json || (
            git add src/data/codolio-snapshot.json
            git commit -m "chore: update Codolio snapshot"
            git push
          )